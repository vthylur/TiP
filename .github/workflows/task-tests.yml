name: TASK-001 Test Foundation

on:
  pull_request:
    branches:
      - main

jobs:
  task-001-test-foundation:
    name: TASK-001 smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run TASK-001 smoke test
        run: python -m pytest tests/test_project_smoke.py

      - name: Start isolated database (TASK-002)
        run: docker compose up -d --wait

      - name: Run TASK-002 database smoke test
        run: python -m pytest tests/test_db_smoke.py -v

      - name: Run TASK-003 database design proof
        run: python -m pytest tests/test_db_design_proof.py -v

      - name: Tear down isolated database (TASK-002)
        if: always()
        run: docker compose down --volumes
